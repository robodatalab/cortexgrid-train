name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install model-gateway
        run: pip install "model-gateway @ git+https://github.com/paksas/model-gateway.git"

      - name: Install remaining dependencies
        run: pip install peft transformers tqdm pytest

      - name: Install package
        run: pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ -v
