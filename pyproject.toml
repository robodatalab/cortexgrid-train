[project]
name = "model-training"
version = "0.1.0"
description = "Training facilities (SFT, LoRA) built on model-gateway"
requires-python = ">=3.11"
dependencies = [
    "model-gateway @ file:///Users/piotrtrochim/GitHub/model-gateway",
    "peft>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.67.0",
    "transformers>=4.40.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "types-tqdm>=4.67.3.20260402",
]
