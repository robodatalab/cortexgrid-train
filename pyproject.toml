[project]
name = "cortexgrid-train"
version = "0.1.7"
description = "PyTorch training loops instrumented for cortexgrid: metrics, checkpoints, and resume"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    # 0.2.93: works with the Ray 2.58 cluster (Python 3.11.13).
    "cortexgrid>=0.2.93",
    "peft>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.67.0",
    "transformers>=4.40.0",
]

[project.urls]
Homepage = "https://github.com/robodatalab/cortexgrid-train"
Repository = "https://github.com/robodatalab/cortexgrid-train"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/cortexgrid_train"]

[dependency-groups]
dev = [
    "types-tqdm>=4.67.3.20260402",
]
